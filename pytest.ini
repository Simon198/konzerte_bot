[pytest]
pythonpath = .
testpaths = tests web_scraping/scrapers/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --import-mode=importlib
markers =
    unit: unit tests (fast, no database/network); run with `pytest -m unit`
    integration: integration tests that require a database or network access (run with `pytest -m integration`)
